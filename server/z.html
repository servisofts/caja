<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Venta</title>
</head>
<body>
  <h1>Registrar Venta</h1>

  <textarea id="jsonInput" style="width: 100%; height: 300px;"></textarea>
  <br /><br />
  <button id="venderBtn">Vender</button>

  <p id="status"></p>

  <script>
    // JSON que mostraste, stringify con formato para mostrar en textarea
    const jsonData = {
      "descripcion": "",
      "observacion": "Observación",
      "facturar": false,
      "facturar_luego": false,
      "cliente": {
          "nit": "",
          "razon_social": ""
      },
      "descuentos": [],
      "key_usuario": "1e4b2e09-94f1-4f9e-9d58-80d4d2f9ab3b",
      "key_caja": "b8d3e10a-9442-4c4e-be75-45842bc5ae4b",
      "key_almacen": "0f8fb5f0-c4c1-4e98-ad8d-dcdbfba65258",
      "key_moneda": "2f6b73df-8004-41c1-aa5f-1a81d79d1a8f",
      "detalle": [
          {
              "cantidad": 1,
              "precio_unitario": 6,
              "precio_unitario_base": "60",
              "detalle": "",
              "descripcion": "Leche Pil 1 Litro",
              "key_modelo": "0298d0bc-6f51-40ee-9fb5-ad0c1370f932",
              "costos": []
          },
          {
              "cantidad": 1,
              "precio_unitario": 12,
              "precio_unitario_base": "12",
              "detalle": "",
              "descripcion": "Agua 2L",
              "key_modelo": "e27404ae-70b1-444f-8f3e-085712693024",
              "costos": []
          }
      ],
      "tipos_pago": {
          "4dae99ee-0f86-4368-bc74-9b90ba56ca1b": {
              "monto_nacional": 72,
              "monto_extranjera": 36,
              "tipo_pago": {
                  "descripcion": "Caja",
                  "estado": 1,
                  "fecha_on": "2025-09-18T17:18:05.103109",
                  "icon": "Money",
                  "orden": 2,
                  "key": "caja",
                  "observacion": null
              }
          }
      }
    };

    // Setear JSON formateado en textarea
    document.getElementById('jsonInput').value = JSON.stringify(jsonData, null, 2);

    document.getElementById('venderBtn').addEventListener('click', () => {
      const statusEl = document.getElementById('status');
      let data;
      try {
        data = JSON.parse(document.getElementById('jsonInput').value);
      } catch (e) {
        statusEl.textContent = 'Error: JSON inválido.';
        statusEl.style.color = 'red';
        return;
      }

      statusEl.textContent = 'Enviando...';
      statusEl.style.color = 'black';

      fetch('http://localhost:30045/rest/venta/registrar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) throw new Error(`Error ${res.status}`);
        return res.json();
      })
      .then(json => {
        statusEl.textContent = 'Venta registrada correctamente.';
        statusEl.style.color = 'green';
        console.log('Respuesta:', json);
      })
      .catch(err => {
        statusEl.textContent = 'Error al registrar la venta: ' + err.message;
        statusEl.style.color = 'red';
        console.error(err);
      });
    });
  </script>
</body>
</html>
